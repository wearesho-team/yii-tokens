name: PHP Composer

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: [ '8.4', '8.5' ]
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yii_tokens
          POSTGRES_USER: yii_tokens
          POSTGRES_PASSWORD: demo
        ports:
          - 5492:5432
        options: --health-cmd="pg_isready -U yii_tokens" --health-interval=10s --health-timeout=5s --health-retries=5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: yii_tokens
          MYSQL_USER: 'yii_tokens'
          MYSQL_PASSWORD: 'demo'
          MYSQL_ROOT_PASSWORD: 'root_password'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3308:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          ini-values: "post_max_size=128M"
          coverage: xdebug

      - name: Check PHP Version
        run: |
          php -v
          composer --version

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}-
      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS linter
        run: composer run-script lint

      - name: Run PHPUnit tests (PostgreSQL)
        run: composer run-script cover

      - name: Run PHPUnit tests (MySQL)
        run: composer run-script test
        env:
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3308
          DB_NAME: yii_tokens
          DB_USER: yii_tokens
          DB_PASS: demo

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: ./coverage.xml
